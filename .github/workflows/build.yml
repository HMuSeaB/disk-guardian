name: Build & Package DiskGuardian

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore Dependencies
        shell: pwsh
        run: |
          dotnet restore src/DiskGuardian.sln -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Build, Test & Package
        shell: pwsh
        run: |
          .\build_release.ps1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: disk-guardian-windows-x64
          path: |
            dist/*.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/disk-guardian-winui3-win-x64.zip
            dist/disk-guardian-cli-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
